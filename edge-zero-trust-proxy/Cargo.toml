[package]
name = "edge-zero-trust-proxy"
version = "0.1.0"
edition = "2021"
authors = ["Mary-Jane Davies <mjpunkin@outlook.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
jsonwebtoken = { version = "11.0", default-features = false, features = ["rust_crypto"] }
getrandom = { version = "0.2", features = ["js"] }
serde = "1.0.229"
worker = { version = "0.8" }
worker-macros = { version = "0.8" }
